name: WAN Show Wallpaper

on:
  schedule:
    # Every 3 hours. Adjust to taste — WAN Show usually drops Friday evenings.
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  models: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install yt-dlp
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp --version
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci

      - name: Generate latest wallpaper
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          DATA_FILE: ./docs/latest.json
        run: node scripts/generate.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || git commit -m "Update wallpaper $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
