name: WAN Show Wallpaper

on:
  schedule:
    # Every 3 hours. Adjust to taste — WAN Show usually drops Friday evenings.
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Generate latest wallpaper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATA_FILE: ./docs/latest.json
        run: node scripts/generate.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || git commit -m "Update wallpaper $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
