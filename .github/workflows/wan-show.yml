name: WAN Show Wallpaper

on:
  schedule:
    # Every 3 hours. Adjust to taste — WAN Show usually drops Friday evenings.
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  models: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm ci

      - name: Generate latest wallpaper
        env:
          # No secret needed — the built-in GITHUB_TOKEN (scoped by the
          # `models: read` permission above) authenticates GitHub Models.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATA_FILE: ./docs/latest.json
        run: node scripts/generate.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || git commit -m "Update wallpaper $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
